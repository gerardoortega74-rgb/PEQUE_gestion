<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C3410">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>PEQUE Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: "taller de pintura". Móvil: cabecera, franja de rodillo, bento 2 columnas, barra inferior con botón + central.
   Escritorio (>=980px): barra lateral fija con la marca y bento de 4 columnas. La rueda de color del logo es el objetivo anual. */
:root{
  --paper:#F3F4EE; --card:#FFFFFF; --ink:#22251D; --muted:#646859; --line:#DCE0D0; --soft:#EAEFDA;
  --green:#A9BD57; --green-deep:#3E4B16; --green-ink:#4F5E17; --on-green:#1B2109; --grey:#6B6D69;
  --hero:#2C3410; --hero-ink:#F2F5E6; --hero-muted:#B9C394;
  --ok:#2C7A4B; --ok-bg:#DFF0E4; --warn:#94600F; --warn-bg:#FAEBD2; --bad:#AE3B28; --bad-bg:#F7E0DA; --idle-bg:#E8EAE2;
  --wheel-off:#E1E4D7; --bar-a:#A9BD57; --bar-b:#C4C7BC; --focus:#2A55C4;
  --f-display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-lg:22px; --r:14px; --r-sm:10px;
  --lift:0 1px 0 rgba(34,37,29,.04), 0 10px 30px -12px rgba(44,52,16,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12140E; --card:#1B1E16; --ink:#EDF0E3; --muted:#A4A996; --line:#30352A; --soft:#242A19;
  --green:#B6CA63; --green-deep:#D3E38F; --green-ink:#C9DB7C; --on-green:#171C07; --grey:#B8BBB1;
  --hero:#222A0C; --hero-ink:#F2F5E6; --hero-muted:#AEB98A;
  --ok:#7ACB96; --ok-bg:#1C3324; --warn:#E6B260; --warn-bg:#372A12; --bad:#F2907D; --bad-bg:#3C201A; --idle-bg:#272A22;
  --wheel-off:#2D3226; --bar-a:#B6CA63; --bar-b:#4A4E43; --focus:#8EA9F0;
  --lift:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12140E; --card:#1B1E16; --ink:#EDF0E3; --muted:#A4A996; --line:#30352A; --soft:#242A19;
  --green:#B6CA63; --green-deep:#D3E38F; --green-ink:#C9DB7C; --on-green:#171C07; --grey:#B8BBB1;
  --hero:#222A0C; --hero-ink:#F2F5E6; --hero-muted:#AEB98A;
  --ok:#7ACB96; --ok-bg:#1C3324; --warn:#E6B260; --warn-bg:#372A12; --bad:#F2907D; --bad-bg:#3C201A; --idle-bg:#272A22;
  --wheel-off:#2D3226; --bar-a:#B6CA63; --bar-b:#4A4E43; --focus:#8EA9F0;
  --lift:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark}
@property --p { syntax:'<number>'; inherits:false; initial-value:0; }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 112px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand img{height:40px;width:auto;border-radius:9px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.brand b{font-family:var(--f-display);font-weight:800;font-style:italic;font-size:23px;letter-spacing:.03em;color:var(--grey);line-height:1}
.yearsel{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-weight:700;font-size:14px;min-height:40px;width:auto}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
main{padding-block:6px 16px}
h1.view{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,7vw,40px);letter-spacing:-.02em;line-height:1.05;margin:6px 0 16px;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0 0 10px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---- franja de rodillo (saludo) ---- */
.stroke{position:relative;margin:6px 0 18px;padding:18px 22px 20px 96px;color:var(--on-green);isolation:isolate;min-height:104px}
.stroke::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--green);filter:url(#rough);border-radius:4px;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 7px),linear-gradient(var(--green),var(--green))}
.stroke .roller{position:absolute;left:0;top:50%;width:92px;height:118px;transform:translateY(-50%);z-index:1}
.stroke .hi{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,7vw,36px);line-height:1.05;letter-spacing:-.02em}
.stroke .sub{font-weight:600;font-size:15px;opacity:.85;margin-top:4px}
.anim .stroke::before{animation:paint 1.1s cubic-bezier(.6,.05,.25,1) both}
.anim .stroke .roller{animation:roll 1.1s cubic-bezier(.6,.05,.25,1) both}
.anim .stroke .txt{animation:fadein .5s .75s both}
@keyframes paint{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes roll{from{left:calc(100% - 92px);opacity:0}12%{opacity:1}to{left:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---- bento ---- */
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:22px}
@media(min-width:760px){.bento{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--card);border-radius:var(--r-lg);padding:16px;min-width:0;box-shadow:var(--lift);position:relative;overflow:hidden;text-align:left;border:0;display:flex;flex-direction:column;gap:2px}
button.tile{transition:transform .18s ease}
button.tile:active{transform:scale(.98)}
.tile .l{font-size:14px;font-weight:700;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:clamp(21px,5.6vw,28px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:6px;overflow-wrap:anywhere}
.tile .h{font-size:13.5px;color:var(--muted);margin-top:auto;padding-top:6px}
.tile.wheel{grid-column:span 2;background:var(--hero);color:var(--hero-ink);padding:18px;flex-direction:row;align-items:center;gap:16px}
@media(min-width:760px){.tile.wheel{grid-row:span 2}}
.tile.wheel .wtxt{min-width:0;flex:1}
.tile.wheel .l{color:var(--hero-muted)}
.tile.wheel .v{font-size:clamp(26px,7vw,40px)}
.tile.wheel .h{color:var(--hero-muted)}
.tile.wheel svg{width:min(46vw,210px);height:auto;flex:none}
@media(max-width:519px){.tile.wheel{flex-direction:column;align-items:stretch;text-align:center}.tile.wheel svg{width:min(72vw,250px);margin:0 auto 6px}}
@media(min-width:760px){.tile.wheel{flex-direction:column;align-items:stretch}.tile.wheel svg{width:100%;max-width:300px;margin:0 auto}}
.wheel path{transition:fill .35s ease}
.wheel path.off{fill:var(--wheel-off)}
.tile.wheel .wheel path.off{fill:rgba(255,255,255,.08)}
.tile.alert{background:var(--bad-bg)}
.tile.alert .v,.tile.alert .l{color:var(--bad)}
.tile.chart{grid-column:span 2}
@media(min-width:760px){.tile.chart{grid-column:span 4}}
.bars{width:100%;height:auto;display:block;margin-top:8px}
.bars text{fill:var(--muted);font:600 11px var(--f-body)}
.bars text.cur{fill:var(--ink);font-weight:800}
.bars .a{fill:var(--bar-a)} .bars .b{fill:var(--bar-b)} .bars .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:14px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* ---- cartas de color (listas) ---- */
.list{display:grid;gap:10px}
@media(min-width:760px){.list.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chipcard{display:flex;align-items:stretch;background:var(--card);border-radius:var(--r);box-shadow:var(--lift);overflow:hidden;text-align:left;width:100%;border:0;padding:0;min-height:76px;transition:transform .18s ease}
.chipcard:active{transform:scale(.985)}
.chipcard .sw{width:64px;flex:none;background:var(--sw);display:flex;flex-direction:column;justify-content:space-between;padding:9px 8px;color:#1A1C14}
.chipcard .sw b{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.chipcard .sw small{font-size:10.5px;font-weight:700;line-height:1.1;opacity:.8;overflow-wrap:anywhere}
.chipcard .main{flex:1;min-width:0;padding:11px 12px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.chipcard .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipcard .s{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipcard .amt{padding:11px 12px 11px 0;text-align:right;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:6px}
.chipcard .amt b{font-family:var(--f-display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-borrador{background:var(--idle-bg);color:var(--muted)}
.p-enviado,.p-pendiente{background:var(--warn-bg);color:var(--warn)}
.p-aceptado,.p-cobrada,.p-facturado{background:var(--ok-bg);color:var(--ok)}
.p-rechazado,.p-vencida{background:var(--bad-bg);color:var(--bad)}
.docno{font-weight:700;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---- controles ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:700;min-height:46px;text-align:center;transition:transform .15s ease, background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.dark{background:var(--hero);border-color:var(--hero);color:var(--hero-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-bg);background:var(--bad-bg)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tools input[type=search]{flex:1;min-width:160px;border-radius:999px;padding-inline:16px}
.seg{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap;min-height:38px}
.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:46px}
textarea{min-height:80px;resize:vertical}
label.f{display:grid;gap:5px;font-size:14px;font-weight:700;color:var(--muted);min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
@media(max-width:420px){.fgrid.r1{grid-template-columns:1fr}}
.empty{border-radius:var(--r-lg);padding:26px 18px;text-align:center;color:var(--muted);background:var(--card);box-shadow:var(--lift);display:grid;justify-items:center;gap:6px}
.empty .dot{width:44px;height:44px;border-radius:50%;background:conic-gradient(#E9CF4A,#E8A04B,#E0705C,#C9618C,#8C6BB5,#5A7EC4,#4C9AA5,#62A47A,#A9BD57,#E9CF4A);-webkit-mask:radial-gradient(circle,transparent 9px,#000 10px);mask:radial-gradient(circle,transparent 9px,#000 10px);margin-bottom:4px}
.empty b{color:var(--ink);font-size:17px}
.banner{border-radius:var(--r);padding:12px 14px;font-size:15px;margin-bottom:14px;background:var(--warn-bg);color:var(--warn);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.info{background:var(--soft);color:var(--green-ink)}
.card{background:var(--card);border-radius:var(--r-lg);padding:16px;min-width:0;box-shadow:var(--lift)}
.section{margin-bottom:22px}
.sechead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.sechead h2{margin:0;flex:1}

/* ---- navegación ---- */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bot .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.bot button.nv{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:12px;font-weight:700;color:var(--muted);min-height:58px}
nav.bot button.nv svg{width:23px;height:23px}
nav.bot button.nv[aria-current=page]{color:var(--green-ink)}
nav.bot .fabwrap{display:flex;justify-content:center}
.fab{width:62px;height:62px;border-radius:50%;border:0;margin-top:-26px;margin-bottom:6px;position:relative;display:grid;place-items:center;
  background:conic-gradient(#E9CF4A,#E8A04B,#E0705C,#C9618C,#8C6BB5,#5A7EC4,#4C9AA5,#62A47A,#A9BD57,#E9CF4A);box-shadow:0 10px 24px -8px rgba(44,52,16,.55)}
.fab::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--hero)}
.fab svg{position:relative;z-index:1;width:26px;height:26px;stroke:var(--hero-ink);stroke-width:2.6}
.fab span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.side-brand{display:none}
.side-only{display:none!important}
@media(min-width:980px){
  nav.bot{top:0;right:auto;width:236px;border-top:0;border-right:1px solid var(--line);padding:20px 14px}
  nav.bot .in{display:flex;flex-direction:column;align-items:stretch;gap:4px;max-width:none}
  nav.bot .side-brand{display:block;margin-bottom:18px}
  nav.bot .side-only{display:flex!important;order:9}
  nav.bot .side-brand img{width:100%;border-radius:12px;background:#fff}
  nav.bot button.nv{flex-direction:row;gap:12px;font-size:15px;padding:11px 14px;border-radius:12px;min-height:46px;justify-content:flex-start}
  nav.bot button.nv[aria-current=page]{background:var(--soft)}
  nav.bot .fabwrap{order:-1;justify-content:stretch;margin-bottom:12px}
  .fab{width:100%;height:52px;border-radius:14px;margin:0;background:var(--green);box-shadow:none}
  .fab::after{display:none}
  .fab svg{stroke:var(--on-green)}
  .fab span{position:static;width:auto;height:auto;clip:auto;font-weight:800;color:var(--on-green);margin-left:8px}
  .fab{display:flex;align-items:center;justify-content:center}
  body{padding-left:236px}
  .app{padding-bottom:40px}
  header.top .brand img{display:none}
}

/* ---- hojas ---- */
.scrim{position:fixed;inset:0;background:rgba(14,17,8,.5);z-index:40;animation:fadein .2s both}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;top:max(24px,env(safe-area-inset-top,0px));background:var(--paper);border-radius:24px 24px 0 0;display:flex;flex-direction:column;max-width:780px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
.sheet.mini{top:auto}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:14px 16px}
.sheet .sh h3{margin:0;font-family:var(--f-display);font-size:21px;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .sb{flex:1;overflow-y:auto;padding:4px 16px 16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .sf{border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--card)}
.sheet .sf .btn{flex:1}
.x{border:0;background:var(--idle-bg);width:40px;height:40px;border-radius:50%;font-size:20px;line-height:1}
.create{display:grid;gap:10px;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.create button{display:flex;align-items:center;gap:14px;border:0;background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--lift);text-align:left;min-height:68px}
.create .sw{width:46px;height:46px;border-radius:12px;background:var(--sw);display:grid;place-items:center;flex:none}
.create .sw svg{width:22px;height:22px;stroke:#1A1C14}
.create b{display:block;font-size:17px}
.create small{color:var(--muted);font-size:14px}
.lines{display:grid;gap:10px}
.line{background:var(--card);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;box-shadow:var(--lift)}
.line .c{grid-column:1/-1}
.line .imp{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.line .imp b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:16px}
.line .rm{border:0;background:transparent;color:var(--bad);font-size:14px;font-weight:700;padding:6px 0;min-height:36px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.chip{border:1.5px dashed var(--green);background:transparent;border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--green-ink);font-weight:700;min-height:36px}
.tot{display:grid;gap:4px;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between;gap:12px}
.tot .big{font-family:var(--f-display);font-weight:800;font-size:26px;border-top:3px solid var(--green);padding-top:8px;margin-top:6px;letter-spacing:-.01em}
.dochero{border-radius:var(--r-lg);background:var(--sw);color:#1A1C14;padding:16px 18px;margin-bottom:14px;position:relative;overflow:hidden}
.dochero .no{font-weight:800;font-size:14px;opacity:.75}
.dochero .who{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;margin:4px 0 2px;overflow-wrap:anywhere}
.dochero .amt{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9vw,42px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:8px}
.dochero .pill{background:rgba(255,255,255,.75);color:#1A1C14}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:6px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr.res td{font-weight:800;border-bottom:0;font-family:var(--f-display);font-size:19px}
.tw{overflow-x:auto}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}
.actions .wide{grid-column:1/-1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.taxbar{height:12px;border-radius:999px;background:var(--idle-bg);overflow:hidden;display:flex;margin:10px 0 4px}
.taxbar i{display:block;height:100%}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);width:max-content;box-shadow:var(--lift);animation:tin .25s both}
@keyframes tin{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast.bad{background:var(--bad);color:#fff}
.toast.good{background:var(--green);color:var(--on-green);font-family:var(--f-display);font-size:18px;font-weight:800}
.dlg{position:fixed;z-index:51;left:16px;right:16px;top:50%;transform:translateY(-50%);max-width:420px;margin:0 auto;background:var(--card);border-radius:20px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg h4{margin:0 0 6px;font-family:var(--f-display);font-size:21px}
.dlg p{margin:0 0 16px;color:var(--muted)}
.dlg .row .btn{flex:1}
.scrim.top{z-index:50}
.foot-note{font-size:13.5px;color:var(--muted);margin-top:10px}
.hash{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere;font-family:ui-monospace,Menlo,monospace}
.checkrow{display:flex;gap:10px;align-items:center;font-weight:600;font-size:15px}
.checkrow input{width:22px;height:22px;min-height:0;flex:none}
#splash{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:70}
body.locked nav.bot,body.locked header.top .yearsel,body.locked header.top .iconbtn{display:none}
@media(min-width:980px){body.locked{padding-left:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

      didParseCell: h => { if (h.section === 'body' && h.row.index === 0) h.cell.styles.minCellHeight = 32; if (h.section === 'body' && h.row.index === 2) { h.cell.styles.textColor = GREY; h.cell.styles.fontSize = 8.5; } },
      didDrawCell: h => { if (firma && h.section === 'body' && h.row.index === 0 && h.column.index === 0) { try { doc.addImage(firma, 'PNG', h.cell.x + 8, h.cell.y + 2, 44, 28.5); } catch (e) { } } }
    });
  } else {
    const pago = emp.iban && t.total > 0 ? 'Forma de pago: transferencia bancaria a la cuenta ' + emp.iban + (d.vencimiento ? ' antes del ' + fmtDate(d.vencimiento) : '') + '. Indique el número de factura en el concepto.' : '';
    if (pago) {
      const pl = doc.splitTextToSize(pago, W - 2 * M - 10);
      if (ty + pl.length * 4.4 + 8 > 276) { doc.addPage(); header(); ty = 56; }
      doc.setFillColor(...LABEL_BG); doc.rect(M, ty - 4.5, W - 2 * M, pl.length * 4.4 + 6, 'F');
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...INK); doc.text(pl, M + 5, ty); ty += pl.length * 4.4 + 8;
    }
  }
  const n = doc.getNumberOfPages();
  const pie = emp.pie || [emp.nombre, emp.titular, emp.tel ? 'Tel. ' + emp.tel : ''].filter(Boolean).join(' | ');
  for (let i = 1; i <= n; i++) {
    doc.setPage(i); doc.setDrawColor(...LINE); doc.setLineWidth(0.2); doc.line(M, 283, W - M, 283);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.8); doc.setTextColor(...GREY);
    doc.text(pie, M, 288); doc.text('Página ' + i + (n > 1 ? ' de ' + n : ''), W - M, 288, { align: 'right' });
  }
  return doc;
}

const WHEEL = ['#E9CF4A','#E8A04B','#E0705C','#C9618C','#8C6BB5','#5A7EC4','#4C9AA5','#62A47A','#A9BD57'];
function hashIdx(s){ let h = 0; for (const ch of String(s||'')) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % WHEEL.length; }
const swatch = s => WHEEL[hashIdx(s)];
const initials = s => (String(s||'?').trim().split(/\s+/).filter(w => w.length > 2 || /^[A-ZÁÉÍÓÚÑ]/.test(w)).slice(0,2).map(w => w[0]).join('') || '?').toUpperCase();
function tint(hex, k){ const n = parseInt(hex.slice(1),16); const c = [n>>16, n>>8&255, n&255].map(v => Math.round(v + (255-v)*k)); return 'rgb(' + c.join(',') + ')'; }
function arcPath(r0, r1, a0, a1){
  const P = (r,a) => [(r*Math.sin(a)).toFixed(2), (-r*Math.cos(a)).toFixed(2)];
  const [x1,y1] = P(r1,a0), [x2,y2] = P(r1,a1), [x3,y3] = P(r0,a1), [x4,y4] = P(r0,a0);
  return `M${x1} ${y1}A${r1} ${r1} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r0} ${r0} 0 0 0 ${x4} ${y4}Z`;
}
function wheelSvg(p, label, animate){
  const n = WHEEL.length, gap = 0.035, rings = [[67,98,0],[49,66,.32],[33,48,.58]];
  let paths = '';
  for (let i = 0; i < n; i++) {
    const a0 = i/n*2*Math.PI + gap/2, a1 = (i+1)/n*2*Math.PI - gap/2, frac = Math.max(0, Math.min(1, p*n - i));
    rings.forEach(([r0,r1,k], j) => {
      const lit = frac >= (j+1)/3 - 1e-9;
      const delay = animate ? ` style="transition-delay:${(i*110 + j*40)}ms"` : '';
      paths += `<path d="${arcPath(r0,r1,a0,a1)}" fill="${tint(WHEEL[i],k)}" class="${lit && !animate ? '' : 'off'}" ${lit?'data-lit="1"':''}${delay}/>`;
    });
  }
  return `<svg class="wheel" viewBox="-100 -100 200 200" role="img" aria-label="${esc(label)}">${paths}
    <text x="0" y="8" text-anchor="middle" style="fill:var(--hero-ink);font:800 22px var(--f-display)">${Math.round(p*100)}%</text></svg>`;
}
function barsSvg(fac, gas){
  const W = window.innerWidth >= 760 ? 760 : 360, H = 156, base = 124, top = 14, gw = W/12, mx = Math.max(1, ...fac, ...gas);
  const sc = v => (v/mx) * (base - top), cm = S.year === now.getFullYear() ? now.getMonth() : -1;
  const M = ['E','F','M','A','M','J','J','A','S','O','N','D'], MN = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  let g = `<line class="grid" x1="0" x2="${W}" y1="${top}" y2="${top}"/><line class="grid" x1="0" x2="${W}" y1="${base}" y2="${base}"/>
    <text x="${W}" y="${top-4}" text-anchor="end">${esc(eur(mx))}</text>`;
  for (let m = 0; m < 12; m++) {
    const x = m*gw + gw/2, ha = sc(fac[m]), hb = sc(gas[m]);
    g += `<rect class="a" x="${(x-10).toFixed(1)}" y="${(base-ha).toFixed(1)}" width="9" height="${ha.toFixed(1)}" rx="2.5"><title>${MN[m]}: facturado ${eur(fac[m])}</title></rect>
      <rect class="b" x="${(x+1).toFixed(1)}" y="${(base-hb).toFixed(1)}" width="9" height="${hb.toFixed(1)}" rx="2.5"><title>${MN[m]}: gastos ${eur(gas[m])}</title></rect>
      <text x="${x.toFixed(1)}" y="${H-14}" text-anchor="middle" class="${m===cm?'cur':''}">${M[m]}</text>`;
  }

}

function afterAnim(){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lit = [...document.querySelectorAll('#view .wheel path[data-lit]')];
  const go = () => lit.forEach(p => p.classList.remove('off'));
  if (reduce) return go();
  setTimeout(() => requestAnimationFrame(go), 450);
  const el = document.querySelector('#view [data-count]'); if (!el) return;
  const to = Number(el.dataset.count), t0 = performance.now(), dur = 1300;
  const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = eur(to * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ---------- celebración ---------- */
function splash(x, y){
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('splash'); let ctx; try { ctx = c.getContext('2d'); } catch (e) { return; } if (!ctx) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1); c.width = innerWidth * dpr; c.height = innerHeight * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const P = [];
  for (let i = 0; i < 80; i++) { const a = Math.random()*Math.PI*2, s = 3 + Math.random()*9; P.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 4, r: 3 + Math.random()*6, c: WHEEL[i % WHEEL.length], life: 55 + Math.random()*30 }); }
  for (let i = 0; i < 9; i++) { const a = i/9*Math.PI*2, s = 2 + Math.random()*2.5; P.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 2, r: 12 + Math.random()*10, c: WHEEL[i], life: 40, blob:true }); }
  let f = 0;
  const tick = () => {
    ctx.clearRect(0, 0, innerWidth, innerHeight); let alive = 0;
    for (const p of P) { if (f > p.life) continue; alive++; p.vy += p.blob ? .12 : .32; p.vx *= .985; p.x += p.vx; p.y += p.vy;
      ctx.globalAlpha = Math.max(0, 1 - f / p.life); ctx.fillStyle = p.c; ctx.beginPath();
      if (p.blob) ctx.ellipse(p.x, p.y, p.r * (1 + f/60), p.r * (0.8 + f/90), f/20, 0, Math.PI*2); else ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill(); }
    f++; if (alive) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(tick);
}
function celebrate(msg){ toast(msg, 'good'); const xy = S.lastXY || [innerWidth/2, innerHeight/2]; splash(xy[0], xy[1]); }

/* ---------- hojas (sheets) ---------- */
function pushSheet(s){
  const scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.dataset.act = 'close';
  const el = document.createElement('div'); el.className = 'sheet' + (s.mini ? ' mini' : ''); el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true');
  s.el = el; s.scrim = scrim; S.stack.forEach(o => { o.el.hidden = true; o.scrim.hidden = true; });
  $('#sheets').append(scrim, el); S.stack.push(s);
  if (s.kind === 'detail') renderDetailInto(s); else el.innerHTML = s.html;
  if (s.onMount) s.onMount(el);
  return el;
}
function popSheet(){
  const s = S.stack.pop(); if (!s) return; s.el.remove(); s.scrim.remove();
  const t = S.stack[S.stack.length-1]; if (t) { t.el.hidden = false; t.scrim.hidden = false; if (t.kind==='detail') renderDetailInto(t); }
}
function closeAll(){ while (S.stack.length) popSheet(); }
const shHead = (title) => `<div class="sh"><h3>${title}</h3><button class="x" data-act="close" aria-label="Cerrar">×</button></div>`;

/* ---------- diálogo y toast ---------- */
function ask(title, text, ok = 'Aceptar', danger = false){
  return new Promise(res => {
    const sc = document.createElement('div'); sc.className = 'scrim top';
    const d = document.createElement('div'); d.className = 'dlg'; d.setAttribute('role','alertdialog');
    d.innerHTML = `<h4>${esc(title)}</h4><p>${esc(text)}</p><div class="row"><button class="btn" data-r="0">Cancelar</button><button class="btn ${danger?'danger':'pri'}" data-r="1">${esc(ok)}</button></div>`;
    const done = v => { sc.remove(); d.remove(); res(v); };
    sc.onclick = () => done(false); d.onclick = e => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === '1'); };
    $('#dlgs').append(sc, d); d.querySelector('[data-r="1"]').focus();
  });
}
let toastT;
function toast(msg, kind){ const bad = kind === true; document.querySelectorAll('.toast').forEach(t=>t.remove()); const t = document.createElement('div'); t.className = 'toast' + (bad?' bad':(kind?' '+kind:'')); t.setAttribute('role','status'); t.textContent = msg; document.body.append(t); clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), bad?6000:2600); }
function dbMsg(e){
  const c = e && e.code;
  if (c === 'invalid_argument') return 'No tienes permiso para guardar o el dato no es válido.';
  if (c === 'quota_exceeded') return 'La base de datos está llena. Borra registros antiguos.';
  if (c === 'resource_exhausted') return 'Demasiadas operaciones seguidas. Espera unos segundos.';
  if (c === 'revoked') return 'Se ha retirado el acceso a esta app.';
  return 'No se pudo guardar. Comprueba la conexión e inténtalo de nuevo.';
}

/* ---------- guardar en db ---------- */
async function put(col, id, data){
  if (!S.db) { toast('Sin conexión con la base de datos.', true); throw new Error('nodb'); }
  try {
    const clean = JSON.parse(JSON.stringify(data)); delete clean.id;
    if (id) { await S.db.collection(col).doc(id).set(clean); return id; }
    const ref = S.db.collection(col).doc(); await ref.set(clean); return ref.id;
  } catch (e) { if (e && e.message !== 'nodb') toast(dbMsg(e), true); throw e; }
}
async function patch(col, id, data){
  try { await S.db.collection(col).doc(id).update(data); } catch (e) { toast(dbMsg(e), true); throw e; }
}
async function del(col, id){ try { await S.db.collection(col).doc(id).delete(); } catch (e) { toast(dbMsg(e), true); throw e; } }

function curDetail(){ for (let i = S.stack.length-1; i>=0; i--) if (S.stack[i].kind==='detail') return S.stack[i]; return null; }
async function emitir(f){
  const e = emp();
  if (!e.nif) { toast('Pon tu NIF en Datos de la empresa antes de emitir.', true); return; }
  const serie = f.serie || 'F', y = yearOf(f.fecha);
  const prevSerie = emitidas(S.facturas).filter(x => (x.serie||'F') === serie && yearOf(x.fecha) === y).sort((a,b)=>b.numero.localeCompare(a.numero))[0];
  if (prevSerie && f.fecha < prevSerie.fecha) { toast(`La fecha no puede ser anterior a la de la ${prevSerie.numero} (${fmtDate(prevSerie.fecha)}). Edita la fecha.`, true); return; }
  const c = f.cliente || {};
  let msg = `Se le asignará el número ${nextNumber(S.facturas.filter(x=>(x.serie||'F')===serie), serie, y)} y ya no se podrá editar ni borrar.`;
  if (!c.nif) msg += ' Atención: el cliente no tiene NIF; una factura completa debe llevarlo.';
  if (!await ask('¿Emitir la factura?', msg, 'Emitir')) return;
  const fresh = byId('facturas', f.id); if (!fresh || fresh.estado !== 'borrador') return;
  const numero = nextNumber(S.facturas.filter(x=>(x.serie||'F')===serie), serie, y);
  const last = emitidas(S.facturas).filter(x => x.huella).sort((a,b)=>(b.emitidaEn||'').localeCompare(a.emitidaEn||''))[0];
  const huella = await sha256Hex([e.nif, numero, f.fecha, totals(f).total.toFixed(2), last ? last.huella : ''].join('|'));
  await patch('facturas', f.id, { numero, serie, estado:'pendiente', emitidaEn:new Date().toISOString(), huella, huellaAnterior: last ? last.huella : '', totales: totals(f), emisor: { nombre:e.nombre, titular:e.titular, nif:e.nif, direccion:e.direccion, cp:e.cp, poblacion:e.poblacion, provincia:e.provincia, tel:e.tel, email:e.email, iban:e.iban } });
  celebrate('Factura ' + numero + ' emitida');
}

const pdfName = (k, d) => (k==='presupuesto'?'Presupuesto ':(d.serie==='R'?'Factura rectificativa ':'Factura ')) + (d.numero||'borrador') + ' - ' + (d.cliente?.nombre||'cliente').replace(/[\\/:*?"<>|]/g,'') + '.pdf';

function sendFields(st){

async function doSend(st){
  const d = byId(st.col, st.docId); if (!d) return;

  const file = new File([doc.output('blob')], pdfName(st.k, d), { type:'application/pdf' });
  try { await navigator.share({ files:[file], title:f.subj, text:f.body }); st.sentTo = f.to || 'compartido'; st.el.querySelector('#sd-done').hidden = false; }

  const c = id ? byId('clientes', id) : {}; const f = (k,l,cls='',t='text',im='') => `<label class="f ${cls}"><span>${l}</span><input id="c-${k}" type="${t}" ${im?`inputmode="${im}"`:''} value="${esc(c[k])}"></label>`;

    ${f('nombre','Nombre o razón social','full')}${f('nif','NIF / CIF')}${f('tel','Teléfono','','tel','tel')}${f('email','Email','full','email','email')}
    ${f('direccion','Dirección','full')}${f('cp','C.P.','','text','numeric')}${f('poblacion','Población')}
    <label class="f full"><span>Notas</span><textarea id="c-notas">${esc(c.notas)}</textarea></label></div></form>
  <div class="sf">${id?`<button class="btn danger" data-act="del-cli" data-id="${id}">Borrar</button>`:'<button class="btn" data-act="close">Cancelar</button>'}<button class="btn pri" data-act="save-cli" data-id="${id||''}">Guardar</button></div>`;
  pushSheet({ kind:'form', html });
}

/* ---------- CSV ---------- */
async function saveCsv(name, rows){
  if (!S.dl) return toast('La descarga no está disponible en esta vista.', true);
  try { await S.dl.save({ filename: name, data: '﻿' + rows.map(csvRow).join('\r\n') }); toast('Archivo guardado'); }
  catch (e) { if (!e || e.code !== 'declined') toast('No se pudo descargar el archivo.', true); }
}
function csvFacturas(){
  const y = S.year, ls = emitidas(S.facturas).filter(f => yearOf(f.fecha)===y).sort((a,b)=>a.numero.localeCompare(b.numero));
  const rows = [['Número','Fecha','Cliente','NIF cliente','Base imponible','Tipo IVA','Cuota IVA','Retención','Total','Estado','Fecha cobro']];
  ls.forEach(f => { const t = totals(f); rows.push([f.numero, fmtDate(f.fecha), f.cliente?.nombre, f.cliente?.nif, fmtNum(t.base), t.ivaPct, fmtNum(t.iva), fmtNum(t.ret), fmtNum(t.total), ESTADO_TXT[estadoFactura(f)], fmtDate(f.fechaCobro)]); });
  saveCsv(`Facturas emitidas ${y}.csv`, rows);
}
function csvGastos(){
  const y = S.year, ls = S.gastos.filter(g => yearOf(g.fecha)===y).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const rows = [['Fecha','Proveedor','Concepto','Categoría','Base','Tipo IVA','Cuota IVA','Total','Deducible']];
  ls.forEach(g => rows.push([fmtDate(g.fecha), g.proveedor, g.concepto, g.categoria, fmtNum(g.base), g.ivaPct, fmtNum(g.cuota), fmtNum(g.total), g.deducible===false?'No':'Sí']));
  saveCsv(`Gastos ${y}.csv`, rows);
}

/* ---------- eventos ---------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (['new-pres','new-fac','new-gasto'].includes(a) && S.stack.length && S.stack[S.stack.length-1].mini) popSheet();
  const st = S.stack[S.stack.length-1], det = curDetail();
  const doc = det ? byId(det.k==='factura'?'facturas':'presupuestos', det.id) : null;
  switch (a) {
    case 'create': openCreate(); break;
    case 'go-fac': closeAll(); S.view = 'facturas'; S.fFac = b.dataset.v; S.buscar = ''; render(); window.scrollTo(0,0); break;
    case 'go-pre': closeAll(); S.view = 'presupuestos'; S.fPre = b.dataset.v; S.buscar = ''; render(); window.scrollTo(0,0); break;
    case 'go': closeAll(); S.ajDirty = false; S.view = b.dataset.v; S.buscar = ''; render(); window.scrollTo(0,0); break;
    case 'close': popSheet(); break;
    case 'fpre': S.fPre = b.dataset.v; render(); break;
    case 'ffac': S.fFac = b.dataset.v; render(); break;
    case 'qg': S.qG = Number(b.dataset.v); render(); break;
    case 'q': S.q = Number(b.dataset.v); render(); break;
    case 'new-pres': if (S.canWrite) openEditor('presupuesto'); break;
    case 'new-fac': if (S.canWrite) openEditor('factura', null, { serie:'F' }); break;
    case 'new-gasto': if (S.canWrite) openGasto(); break;
    case 'new-cli': if (S.canWrite) openCliente(); break;
    case 'edit-gasto': openGasto(b.dataset.id); break;
    case 'edit-cli': openCliente(b.dataset.id); break;
    case 'open': openDetail(b.dataset.k, b.dataset.id); break;
    case 'add-line': {
      const c = b.dataset.c != null ? CONCEPTOS[Number(b.dataset.c)] : ['', 'm²'];
      const box = st.el.querySelector('#ed-lines'); const i = box.children.length;
      const first = box.querySelector('.line'); // reutiliza la primera línea si está vacía
      if (first && box.children.length === 1 && !first.querySelector('[data-f=concepto]').value.trim() && c[0]) { first.querySelector('[data-f=concepto]').value = c[0]; first.querySelector('[data-f=unidad]').value = c[1]; first.querySelector('[data-f=cantidad]').focus(); }
      else { box.insertAdjacentHTML('beforeend', lineHtml({ concepto:c[0], cantidad:1, unidad:c[1], precio:'' }, i)); const n = box.lastElementChild; n.querySelector(c[0] ? '[data-f=cantidad]' : '[data-f=concepto]').focus(); n.scrollIntoView({ block:'nearest' }); }
      st.upd(); break; }
    case 'rm-line': { const box = st.el.querySelector('#ed-lines'); if (box.children.length > 1) b.closest('.line').remove(); else box.querySelectorAll('input,textarea').forEach(x=>x.value=''); st.upd(); break; }
    case 'save-ed': saveEditor(st); break;
    case 'edit-doc': if (doc) openEditor(det.k, doc.id); break;
    case 'del-doc':
      if (doc && await ask(det.k==='factura'?'¿Borrar el borrador?':'¿Borrar el presupuesto?', 'No se puede deshacer.', 'Borrar', true)) { await del(det.k==='factura'?'facturas':'presupuestos', doc.id).then(()=>{ popSheet(); toast('Borrado'); }).catch(()=>{}); }
      break;
    case 'dup': if (doc) { const p = clone(doc); ['id','numero','estado','enviado','creado'].forEach(k=>delete p[k]); p.fecha = todayISO(); popSheet(); openEditor('presupuesto', null, p); } break;
    case 'pres-estado': if (doc) patch('presupuestos', doc.id, { estado: b.dataset.v }).then(()=> b.dataset.v === 'aceptado' ? celebrate('¡Presupuesto aceptado!') : toast('Marcado como rechazado')).catch(()=>{}); break;
    case 'to-factura': if (doc) { const p = { clienteId: doc.clienteId, cliente: doc.cliente, obra: doc.obra, lineas: clone(doc.lineas), ivaPct: doc.ivaPct, retPct: doc.retPct, notas:'', presupuestoId: doc.id, serie:'F' }; popSheet(); openEditor('factura', null, p); } break;
    case 'emitir': if (doc) emitir(doc).catch(()=>{}); break;
    case 'cobrar': { const id = b.dataset.id || (doc && doc.id); const fx = byId('facturas', id); if (id) patch('facturas', id, { estado:'cobrada', fechaCobro: todayISO() }).then(()=>celebrate('¡Cobrada! +' + eur(fx ? totals(fx).total : 0))).catch(()=>{}); break; }
    case 'descobrar': if (doc) patch('facturas', doc.id, { estado:'pendiente', fechaCobro: null }).catch(()=>{}); break;
    case 'rectificar': if (doc) { const p = { clienteId: doc.clienteId, cliente: doc.cliente, obra: doc.obra, lineas: doc.lineas.map(l=>({ ...l, cantidad: -parseNum(l.cantidad) })), ivaPct: doc.ivaPct, retPct: doc.retPct, notas:'', serie:'R', refFactura:{ id: doc.id, numero: doc.numero, fecha: doc.fecha }, motivo:'' }; popSheet(); openEditor('factura', null, p); } break;
    case 'pdf': if (doc) savePdf(det.k, doc); break;
    case 'send': if (doc) openSend(det.k, doc); break;
    case 'pdf-send': { const d = byId(st.col, st.docId); if (d) savePdf(st.k, d); break; }
    case 'do-send': doSend(st); break;
    case 'share-pdf': sharePdf(st); break;
    case 'sent-ok': markSent(st); break;
    case 'backup': saveBackup(); break;
    case 'restore': { const fi = document.getElementById('restoreFile'); if (fi) fi.click(); break; }
    case 'save-gasto': saveGasto(st.el, b.dataset.id); break;
    case 'del-gasto': if (await ask('¿Borrar el gasto?', 'No se puede deshacer.', 'Borrar', true)) del('gastos', b.dataset.id).then(()=>{ popSheet(); toast('Gasto borrado'); }).catch(()=>{}); break;
    case 'save-cli': {
      const el = st.el, c = {}; ['nombre','nif','tel','email','direccion','cp','poblacion','notas'].forEach(k => c[k] = el.querySelector('#c-'+k).value.trim());
      if (!c.nombre) return toast('Escribe el nombre.', true);
      put('clientes', b.dataset.id || null, c).then(()=>{ popSheet(); toast('Cliente guardado'); }).catch(()=>{}); break; }
    case 'del-cli': if (await ask('¿Borrar el cliente?', 'Sus presupuestos y facturas conservan los datos.', 'Borrar', true)) del('clientes', b.dataset.id).then(()=>{ popSheet(); toast('Cliente borrado'); }).catch(()=>{}); break;
    case 'csv-fac': csvFacturas(); break;
    case 'csv-gas': csvGastos(); break;
  }
});
document.addEventListener('input', ev => { if (ev.target.closest && ev.target.closest('#ajustes')) S.ajDirty = true; if (ev.target.id === 'buscar') { S.buscar = ev.target.value; const pos = ev.target.selectionStart; render(); const n = $('#buscar'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } } });
document.addEventListener('submit', async ev => {
  ev.preventDefault();
  if (ev.target.id !== 'ajustes') return;
  const d = {}; ['nombre','titular','nif','direccion','cp','poblacion','provincia','tel','email','iban','condiciones','lugar','pie'].forEach(k => d[k] = $('#aj-'+k).value.trim()); d.firmar = $('#aj-firmar').checked;
  d.nif = d.nif.toUpperCase(); d.iban = d.iban.toUpperCase();
  d.meta = r2(parseNum($('#aj-meta').value)); d.ivaDef = Number($('#aj-ivaDef').value); d.validez = Number(parseNum($('#aj-validez').value)) || 30; d.vencimiento = Number(parseNum($('#aj-vencimiento').value)) || 30;
  try { await put('config', 'empresa', d); S.ajDirty = false; toast('Datos guardados'); render(); } catch (e) {}
});
document.addEventListener('pointerdown', ev => { S.lastXY = [ev.clientX, ev.clientY]; }, true);
document.addEventListener('change', ev => { if (ev.target.id === 'restoreFile' && ev.target.files[0]) { restoreBackup(ev.target.files[0]); ev.target.value = ''; } });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && S.stack.length && !document.querySelector('.dlg')) popSheet(); });
$('#yearSel').addEventListener('change', ev => { S.year = Number(ev.target.value); S.q = S.year === now.getFullYear() ? quarterOf(todayISO()) : 4; render(); });

/* ---------- datos en la nube (Firebase) ---------- */
const LS_BACKUP = 'peque-gestion-ultima-copia';
function downloadBlob(name, blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
function lastBackup(){ try { return localStorage.getItem(LS_BACKUP) || ''; } catch (e) { return ''; } }
function dumpAll(){
  const o = {}; if (S.empresa) o['config/empresa'] = clone(S.empresa);
  ['clientes','presupuestos','facturas','gastos'].forEach(c => S[c].forEach(d => { const x = clone(d); delete x.id; o[c + '/' + d.id] = x; }));
  return o;
}
function saveBackup(){
  const data = { app:'peque-gestion', version:1, fecha:new Date().toISOString(), datos: dumpAll() };
  downloadBlob('PEQUE copia de seguridad ' + todayISO() + '.json', new Blob([JSON.stringify(data, null, 1)], { type:'application/json' }));
  try { localStorage.setItem(LS_BACKUP, todayISO()); } catch (e) {}
  toast('Copia guardada en Descargas'); render();
}
async function restoreBackup(file){
  let o; try { o = JSON.parse(await file.text()); } catch (e) { return toast('Ese archivo no es una copia de PEQUE Gestión.', true); }
  if (!o || o.app !== 'peque-gestion' || typeof o.datos !== 'object') return toast('Ese archivo no es una copia de PEQUE Gestión.', true);
  const keys = Object.keys(o.datos).filter(k => /^(config|clientes|presupuestos|facturas|gastos)\/[A-Za-z0-9_\-.~:@+]+$/.test(k));
  if (!await ask('¿Restaurar la copia?', `Copia del ${fmtDate(String(o.fecha).slice(0,10))} con ${keys.length} registros. Los registros de la copia sustituyen a los que tengan el mismo identificador; el resto no se toca.`, 'Restaurar', true)) return;
  try {
    for (let i = 0; i < keys.length; i += 400) { const b = S.db.batch(); keys.slice(i, i + 400).forEach(k => b.set(S.db.doc(k), o.datos[k])); await b.commit(); }
    toast('Copia restaurada');
  } catch (e) { toast('No se pudo restaurar la copia: ' + (e.message || 'error de conexión'), true); }
}
function backupCard(){
  const lb = lastBackup(), u = S.user;
  return `<div class="card section" style="margin-top:14px"><h2>Copia de seguridad</h2>
   <p class="muted" style="margin:0 0 12px">Los datos están guardados en la nube y se ven igual en el móvil y en el ordenador. Aun así, guarda una copia en tu ordenador de vez en cuando.${lb ? ' Última copia: ' + fmtDate(lb) + '.' : ''}</p>
   <div class="actions" style="margin-top:0"><button class="btn pri" type="button" data-act="backup">Guardar copia</button><button class="btn" type="button" data-act="restore">Restaurar copia</button></div>
   <input type="file" id="restoreFile" accept=".json,application/json" hidden></div>
  <div class="card section"><h2>Sesión</h2><p class="muted" style="margin:0 0 12px">Has entrado como <b>${esc(u ? u.email : '')}</b>.</p><button class="btn" type="button" data-act="logout">Cerrar sesión</button></div>`;
}
function backupBanner(){
  if (S.facturas.length + S.presupuestos.length < 5) return '';
  const lb = lastBackup(); const dias = lb ? daysBetween(lb, todayISO()) : 999;
  if (dias < 30) return '';
  return `<div class="banner info"><span style="flex:1">${lb ? 'Tu última copia en el ordenador es de hace ' + dias + ' días.' : 'Guarda una copia de tus datos en este ordenador.'}</span><button class="btn sm" data-act="backup">Guardar copia</button></div>`;
}
function loginHtml(){
  return `<div style="max-width:420px;margin:24px auto 0">
    <div class="stroke" style="padding-left:22px"><div class="txt"><h1 class="hi" style="margin:0">PEQUE Gestión</h1><div class="sub">Presupuestos, facturas y cuentas</div></div></div>
    <form id="login" class="card" novalidate><div class="fgrid r1">
      <label class="f full"><span>Email</span><input id="lg-email" type="email" inputmode="email" autocomplete="username" required></label>
      <label class="f full"><span>Contraseña</span><input id="lg-pass" type="password" autocomplete="current-password" required></label></div>
      <div id="lg-err"></div>
      <div class="actions"><button class="btn pri wide" type="submit">Entrar</button><button class="btn ghost wide" type="button" data-act="reset-pass">He olvidado la contraseña</button></div>
    </form></div>`;
}
function authMsg(e){
  const c = (e && e.code) || '';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-login')) return 'El email o la contraseña no son correctos.';
  if (c.includes('invalid-email')) return 'Escribe un email válido.';
  if (c.includes('too-many-requests')) return 'Demasiados intentos. Espera unos minutos.';
  if (c.includes('network')) return 'Sin conexión a internet. Conéctate e inténtalo de nuevo.';
  return 'No se pudo entrar: ' + (e && e.message || 'error desconocido');
}

/* ---------- arranque ---------- */
S.dl = { save: async ({ filename, data }) => { downloadBlob(filename, data instanceof Blob ? data : new Blob([data], { type: filename.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/octet-stream' })); return { status:'saved' }; } };
S.authState = 'loading';
let unsubs = [];
function startData(){
  unsubs.forEach(u => u()); unsubs = []; S.loaded = {}; S.ready = false;
  const need = ['clientes','presupuestos','facturas','gastos','empresa'];
  const mark = k => { S.loaded[k] = true; if (need.every(n => S.loaded[n])) S.ready = true; render(); };
  const onErr = e => { if (e && e.code === 'permission-denied') { S.denied = true; render(); } else toast('Se perdió la conexión con los datos. Recarga la página.', true); };
  ['clientes','presupuestos','facturas','gastos'].forEach(col => unsubs.push(S.db.collection(col).onSnapshot(s => { S[col] = s.docs.map(d => ({ id:d.id, ...d.data() })); mark(col); }, onErr)));
  unsubs.push(S.db.doc('config/empresa').onSnapshot(s => { S.empresa = s.exists ? s.data() : null; mark('empresa'); }, onErr));
}
(() => {
  const cfg = window.FIREBASE_CONFIG;
  if (!window.firebase || !cfg || !cfg.apiKey || String(cfg.apiKey).includes('PEGA')) { S.authState = 'noconfig'; render(); return; }
  firebase.initializeApp(cfg);
  S.db = firebase.firestore();
  try { S.db.enablePersistence({ synchronizeTabs:true }).catch(() => {}); } catch (e) {}
  firebase.auth().onAuthStateChanged(u => {
    S.user = u; S.denied = false;
    if (u) { S.authState = 'in'; startData(); }
    else { S.authState = 'out'; unsubs.forEach(x => x()); unsubs = []; ['clientes','presupuestos','facturas','gastos'].forEach(c => S[c] = []); S.empresa = null; S.ready = false; }
    closeAll(); render();
  });
  render();
})();
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'login') return;
  ev.preventDefault();
  const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'Entrando…'; $('#lg-err').innerHTML = '';
  try { await firebase.auth().signInWithEmailAndPassword($('#lg-email').value.trim(), $('#lg-pass').value); }
  catch (e) { $('#lg-err').innerHTML = `<div class="banner bad" style="margin:12px 0 0">${esc(authMsg(e))}</div>`; btn.disabled = false; btn.textContent = 'Entrar'; }
}, true);
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'logout') { if (await ask('¿Cerrar sesión?', 'Tendrás que volver a escribir tu email y contraseña.', 'Cerrar sesión')) firebase.auth().signOut(); }
  if (b.dataset.act === 'reset-pass') {
    const em = $('#lg-email').value.trim(); if (!em) return toast('Escribe tu email y vuelve a pulsar.', true);
    try { await firebase.auth().sendPasswordResetEmail(em); toast('Te hemos enviado un correo para cambiar la contraseña.'); } catch (e) { toast(authMsg(e), true); }
  }
});
</script>
